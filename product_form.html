{% extends "base.html" %}{% block title %}{{'Edit' if product else 'Add'}} product | AgroDirect{% endblock %}{% block content %}<section class="section"><div class="container narrow"><div class="form-card"><span class="eyebrow">Farmer listing</span><h1>{{'Edit product' if product else 'List your produce'}}</h1><form method="post"><label>Product name<input name="name" required maxlength="80" value="{{product.name if product else ''}}"></label><label>Category<select name="category" required>{% for c in ['Vegetables','Fruits','Grains','Dairy','Other'] %}<option {% if product and product.category==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select></label><label>Description<textarea name="description" rows="3" maxlength="500">{{product.description if product else ''}}</textarea></label><div class="form-row"><label>Price (₹ per unit)<input type="number" name="price" min="0.01" step="0.01" required value="{{product.price if product else ''}}"></label><label>Available quantity<input type="number" name="quantity" min="0.01" step="0.01" required value="{{product.quantity if product else ''}}"></label></div><label>Unit<select name="unit">{% for u in ['kg','gram','litre','piece','dozen','bag'] %}<option {% if product and product.unit==u %}selected{% endif %}>{{u}}</option>{% endfor %}</select></label><label>Farm / village location<input name="location" required maxlength="120" value="{{product.location if product else ''}}"></label><label>Image URL (optional)<input type="url" name="image_url" value="{{product.image_url if product else ''}}" placeholder="https://..."></label><button class="btn btn-primary full">Save listing</button></form></div></div></section>{% endblock %}
