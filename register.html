{% extends "base.html" %}{% block title %}Create account | AgroDirect{% endblock %}{% block content %}<section class="section"><div class="container narrow"><div class="form-card"><span class="eyebrow">Join the marketplace</span><h1>Create your account</h1><form method="post"><label>Full name<input name="name" required maxlength="80"></label><label>Email<input type="email" name="email" required maxlength="150"></label><label>Phone<input name="phone" required pattern="[0-9]{10}" maxlength="10"></label><label>Village / town / district<input name="location" required maxlength="120"></label><label>Account type<select name="role"><option value="buyer">Buyer</option><option value="farmer">Farmer</option></select></label><label>Password (at least 8 characters)<input type="password" name="password" required minlength="8" autocomplete="new-password"></label><button class="btn btn-primary full">Create account</button></form><p class="muted center">Already registered? <a href="{{ url_for('login') }}">Login</a></p></div></div></section>{% endblock %}
